## Render Blueprint for the standalone MiniPOS image embedding service.
## Connect this repository to Render as a Blueprint once, then pushes to main
## will rebuild and deploy the service automatically.
services:
  - type: web
    name: service-image
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: standard
    branch: main
    autoDeploy: true
    healthCheckPath: /health
    # Pastikan build tidak timeout sebelum model SigLIP selesai di-download
    # ke dalam image. Default Render 15 menit, aman untuk siglip base.

    envVars:
      - key: AI_MODEL_NAME
        value: "google/siglip-base-patch16-224"

      # Set this manually in the Render dashboard. Keep it identical to the
      # AI_SERVICE_TOKEN configured in the backend.
      - key: AI_SERVICE_TOKEN
        sync: false

      - key: AI_MAX_BATCH
        value: "32"

      - key: IMAGE_MAX_SIZE_MB
        value: "5"

      - key: AI_FETCH_TIMEOUT
        value: "15"

      - key: HF_HOME
        value: "/opt/hf"

      # TRANSFORMERS_OFFLINE=1 + HF_HUB_OFFLINE=1 = force runtime pakai
      # cache yang di-bake ke Docker image. TIDAK BOLEH connect ke
      # HuggingFace saat startup → cold start hanya 15-25 detik (RAM load),
      # bukan 120+ detik (download 400MB + load).
      # Build stage Dockerfile sengaja override ke 0 untuk download.
      - key: TRANSFORMERS_OFFLINE
        value: "1"

      - key: HF_HUB_OFFLINE
        value: "1"

      # Fail cepat jika cache bake tidak lengkap (tidak diam-diam fallback
      # online yang berakibat cold start lama).
      - key: HF_HUB_DISABLE_TELEMETRY
        value: "1"
